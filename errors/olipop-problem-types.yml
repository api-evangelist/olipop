source: mcp/olipop-mcp.yml + graphql/olipop-storefront.graphql + live probe responses
format: jsonrpc-2.0
notes: >-
  OLIPOP publishes no error reference and no RFC 9457 problem+json surface. This catalog records the error
  envelopes actually returned by the two machine-readable surfaces on drinkolipop.com, including one
  JSON-RPC error observed verbatim during this enrichment pass. Codes NOT observed live are not invented:
  only the envelope shape and the reserved JSON-RPC ranges are documented.
envelopes:
- surface: UCP / MCP
  media_type: application/json
  shape:
    jsonrpc: '2.0'
    id: <request id>
    error:
      code: <integer>
      message: <string>
      data:
        code: <machine-readable string>
        content: <human-readable string>
        continue_url: <url the buyer can be handed off to>
  note: the data.continue_url field is a genuinely useful agent affordance - it hands the flow back to a
    human-usable storefront URL when the agent cannot proceed
- surface: Storefront GraphQL
  media_type: application/json
  shape:
    errors: [{message: <string>, extensions: {code: <string>}}]
    data:
      '<mutation>':
        userErrors: [{field: [<path>], message: <string>, code: <enum>}]
  note: Storefront mutations return typed userErrors payloads (CartUserError, CustomerUserError and
    siblings, all implementing the DisplayableError interface) alongside the transport-level errors array
