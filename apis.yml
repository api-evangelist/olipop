apis:
- name: OLIPOP Agent Commerce API (UCP over MCP)
  description: >-
    Agent-facing commerce surface for the OLIPOP storefront, implementing the Universal Commerce Protocol
    (UCP) shopping service over MCP JSON-RPC. The merchant profile at /.well-known/ucp declares protocol
    versions 2026-04-08 and 2026-01-23, the checkout, cart, fulfillment, discount, order and catalog
    capabilities, and the Google Pay, Shopify Card and Shop Pay payment handlers. The tools/list call is
    gated on a registered UCP platform agent profile; the tool contract is the OpenRPC schema the profile
    itself points at.
  humanURL: https://drinkolipop.com/agents.md
  baseURL: https://drinkolipop.com/api/ucp/mcp
  tags:
  - Agent Commerce
  - Universal Commerce Protocol
  - MCP
  - Checkout
  - Cart
  - Catalog
  tags_raw:
  - agent-commerce
  - universal-commerce-protocol
  - mcp
  - checkout
  - cart
  - catalog
  properties:
  - type: Documentation
    url: https://drinkolipop.com/agents.md
  - type: APIReference
    url: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
  - type: MCPServer
    url: mcp/olipop-mcp.yml
  - type: ToolCrosswalk
    url: mcp/olipop-tool-crosswalk.yml
  - type: WellKnown
    url: well-known/olipop-ucp.json
- name: OLIPOP Storefront GraphQL API
  description: >-
    Shopify Storefront GraphQL API served on the OLIPOP domain, exposing 35 root query fields and 41
    mutations across products, collections, search, blogs, pages, menus, metaobjects, localization, cart
    and customer accounts. Introspection responds anonymously on the storefront host; write and customer
    operations require a storefront access token or a customer access token.
  humanURL: https://shopify.dev/docs/api/storefront
  baseURL: https://drinkolipop.com/api/2025-07/graphql.json
  tags:
  - GraphQL
  - E-Commerce
  - Catalog
  - Cart
  - Storefront
  tags_raw:
  - graphql
  - ecommerce
  - catalog
  - cart
  - storefront
  properties:
  - type: GraphQL
    url: graphql/olipop-storefront.graphql
  - type: Documentation
    url: https://shopify.dev/docs/api/storefront
  - type: DataModel
    url: data-model/olipop-data-model.yml
- name: OLIPOP Storefront Product JSON
  description: >-
    Unauthenticated read-only JSON endpoints the store's own agent instructions publish for agents that only
    need to read catalog data - all products, a single product by handle, and the products in a collection -
    alongside the sitemap and an agentic discovery sitemap that points at /agents.md.
  humanURL: https://drinkolipop.com/llms.txt
  baseURL: https://drinkolipop.com/products.json
