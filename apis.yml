aid: olipop
name: Olipop
description: >-
  OLIPOP PBC is an Oakland, California prebiotic soda maker founded in 2018 by Ben Goodwin and David Lester,
  built around its trademarked OLISMART blend of plant fibers, prebiotics and botanicals, sold across tens of
  thousands of US retail locations and direct to consumers at drinkolipop.com. It has no traditional developer
  program, but its Shopify-hosted storefront is a genuinely agent-native commerce surface: the domain publishes
  a first-party llms.txt and agents.md describing how AI agents may interact with the store, a Universal
  Commerce Protocol (UCP) merchant profile at /.well-known/ucp, a live UCP/MCP JSON-RPC endpoint at
  /api/ucp/mcp for catalog search, cart, checkout and order tools, an anonymously introspectable Shopify
  Storefront GraphQL API, unauthenticated product/collection JSON endpoints, and OpenID Connect discovery for
  customer accounts. Checkout is explicitly gated on contemporaneous human buyer approval.
