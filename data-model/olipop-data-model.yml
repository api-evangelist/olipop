ucp_object_model:
  note: >-
    The UCP/MCP surface exposes its own cart, checkout and order objects whose JSON Schemas are hosted by
    the protocol, not by OLIPOP. They overlap the GraphQL model but are not identical - most notably UCP has
    a first-class Checkout object where the Storefront schema models checkout as a prepared and submitted Cart.
  schemas:
  - https://ucp.dev/2026-04-08/schemas/shopping/cart.json
  - https://ucp.dev/2026-04-08/schemas/shopping/checkout.json
  - https://ucp.dev/2026-04-08/schemas/shopping/fulfillment.json
  - https://ucp.dev/2026-04-08/schemas/shopping/discount.json
  - https://ucp.dev/2026-04-08/schemas/shopping/catalog_search.json
  - https://ucp.dev/2026-04-08/schemas/shopping/catalog_lookup.json
